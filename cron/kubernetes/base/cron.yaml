apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron
  namespace: feelz
  labels:
    app: cron
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: cron
        spec:
          containers:
          - name: cron
            image: unum-apps-feelz-cron
            imagePullPolicy: Always
            env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_LEVEL
              value: WARNING
          backoffLimit: 0
          restartPolicy: Never
          concurrencyPolicy: Forbid
